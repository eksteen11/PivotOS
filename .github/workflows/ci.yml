name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run start -- --hostname 127.0.0.1 --port 3000 &
      - run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for local server." >&2
          exit 1
      - run: SMOKE_MODE=local SMOKE_BASE_URL=http://127.0.0.1:3000 npx playwright test tests/smoke/common.spec.ts --project=chromium-desktop
